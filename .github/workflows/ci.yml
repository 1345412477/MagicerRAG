name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile all Python
        run: python -m py_compile config.py $(find app rag -name "*.py" -print)
      - name: Syntax check frontend
        run: node --check app/static/app.js
      - name: Run pytest
        env:
          # 测试使用隔离的临时存储（见 tests/conftest.py），此处无需真实密钥
          LLM_API_KEY: sk-test
          EMBEDDING_API_KEY: sk-test
          # 测试用例中按 admin 用户名注册/登录，需要与本地开发一致的提权配置
          ADMIN_USERNAME: admin
        run: python -m pytest -q
