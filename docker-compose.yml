services:
  magicerrag:
    build: .
    image: magicerrag:latest
    container_name: magicerrag
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # —— 模型 ——
      LLM_API_KEY: ${LLM_API_KEY:?请在 .env 中配置 LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-${LLM_API_KEY:-}}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-${LLM_BASE_URL:-}}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      # —— 工作台 ——
      INVITE_CODE: ${INVITE_CODE:-magicer-demo}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      TOP_K: ${TOP_K:-4}
      SCORE_THRESHOLD: ${SCORE_THRESHOLD:-0.3}
    volumes:
      - ./data:/app/data        # SQLite 数据库 + 上传文档（如缺失会按默认路径新建）
      - ./storage:/app/storage  # 向量索引库
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s